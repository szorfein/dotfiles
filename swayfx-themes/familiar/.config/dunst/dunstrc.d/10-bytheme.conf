# To display terminal icon: (nerd-font, icomoon)
# echo "\u<code>", e.g: echo "\uf09c2"
[global]
    font = IosevkaTerm Nerd Font 14
    frame_width = 4
    frame_color = "#2b322f" # inverse-on-surface
    format = "<span rise='-5000' font_desc='Material Symbols Outlined Regular 20'>%I</span><span foreground='#2b322f'> %s</span><span font_desc='Iosevka Nerd Font Regular 14' foreground='#2b322f'> &gt; %b</span>"

[urgency_low]
    background = "#dee4e0" # inverse-surface
    foreground = "#096b5a" # inverse-primary
    timeout = 5
    # Icon for notifications with low urgency
    default_icon = dialog-information

[urgency_normal]
    background = "#dee4e0" # inverse-surface
    foreground = "#096b5a" # inverse-surface
    timeout = 5
    override_pause_level = 30
    # Icon for notifications with normal urgency
    default_icon = dialog-information

[urgency_critical]
    background = "#ffb4ab"
    foreground = "#690005"
    frame_color = "#ffb4ab"
    timeout = 0
    override_pause_level = 60
    # Icon for notifications with critical urgency
    default_icon = dialog-warning

[kew_display]
    appname = kew
    urgency = low
    format = "<span rise='-5000' font_desc='Material Symbols Outlined Regular 20'>music_note_2</span><span foreground='#2b322f'> Kew</span> &gt; <span font_desc='Iosevka Nerd Font Regular 14' foreground='#2b322f'>%b</span>"
    history_ignore = yes

[bleachbit_display]
    appname = BleachBit
    urgency = normal
    format = "<span rise='-5000' font_desc='Material Symbols Outlined Regular 20'>pending_actions</span><span foreground='#2b322f'> BleachBit</span> &gt; <span font_desc='Iosevka Nerd Font Regular 14' foreground='#2b322f'>%b</span>"
    history_ignore = yes
