    strip_comp: true
    to_dest: .themes
  - name: black.svg
    url: https://github.com/Big-B/swaylock-fancy/raw/refs/heads/main/icons/black.svg
    to_dest: .local/share/icons
  - name: white.svg
    url: https://github.com/Big-B/swaylock-fancy/raw/refs/heads/main/icons/white.svg
    to_dest: .local/share/icons
